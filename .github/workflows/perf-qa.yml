name: Temporary performance QA

on:
  push:
    branches:
      - visual-qa-animation
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "qa/perf_qa.py"
      - ".github/workflows/perf-qa.yml"

permissions:
  contents: read

jobs:
  performance-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium QA runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python -m http.server 4173 > /tmp/riz-http.log 2>&1 &
          sleep 2
      - name: Run performance QA
        run: python qa/perf_qa.py
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riz-performance-qa
          path: perf_artifacts/
          if-no-files-found: error
