name: Temporary visual animation QA

on:
  push:
    branches:
      - visual-qa-animation

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python -m http.server 4173 > /tmp/riz-http.log 2>&1 &
          sleep 2
      - name: Render and capture animation states
        run: python qa/visual_qa.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riz-visual-qa
          path: qa_artifacts/
          if-no-files-found: error
